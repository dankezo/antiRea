[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "antirea-quota-guard"
version = "2.2.0"
description = "Python/FastAPI port of antiRea's quota-guard module (examples/python-fastapi)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.110",
    "starlette>=0.37",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    # Test-only: used by tests/test_redis_integration.py against a real
    # server. The quota_guard package itself never imports redis; the
    # Redis store stays duck-typed.
    "redis>=5",
]

[tool.setuptools]
packages = ["quota_guard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
